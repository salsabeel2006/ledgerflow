version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ledgerflow_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ledgerflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: ledgerflow_api
    restart: always
    command: >
      sh -c "python -m alembic upgrade head &&
            python -m uvicorn apps.api.src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/ledgerflow
    depends_on:
      - db

volumes:
  postgres_data: