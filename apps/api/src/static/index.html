<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LedgerFlow — Financial Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-container">
    <header class="navbar">
      <div class="logo">Ledger<span>Flow</span></div>
      <div id="user-pill" class="user-pill hidden">
        <span class="status-dot"></span>
        <span id="user-email">loading...</span>
        <button id="logout-btn" class="btn-secondary-sm">Logout</button>
      </div>
    </header>

    <main class="content">
      <section id="auth-section" class="card auth-card">
        <div class="tabs">
          <button id="tab-login" class="tab-btn active">Login</button>
          <button id="tab-register" class="tab-btn">Register</button>
        </div>

        <form id="auth-form" class="form-layout">
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="auth-email" required placeholder="engineer@ledgerflow.io">
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" id="auth-password" required placeholder="••••••••••••">
          </div>
          <button type="submit" id="auth-submit" class="btn-primary">Sign In</button>
        </form>
      </section>

      <section id="dashboard-section" class="dashboard-grid hidden">
        <div class="card balance-card">
          <span class="card-label">Primary Wallet</span>
          <div class="balance-display">
            <span class="currency-symbol">$</span>
            <h1 id="account-balance">0.00</h1>
          </div>
          <div class="wallet-meta">
            <span>Account ID: <code id="account-id">None</code></span>
            <div class="btn-group">
              <button id="create-wallet-btn" class="btn-secondary-sm">Create USD Wallet</button>
              <button id="deposit-btn" class="btn-primary-sm hidden">+ Deposit $250</button>
            </div>
          </div>
        </div>

        <div class="card transfer-card">
          <h3>Quick Transfer</h3>
          <form id="transfer-form" class="form-layout">
            <div class="input-group">
              <label>Source Account ID</label>
              <input type="text" id="transfer-from" required readonly>
            </div>
            <div class="input-group">
              <label>Destination Account ID</label>
              <input type="text" id="transfer-to" required placeholder="Paste recipient UUID">
            </div>
            <div class="input-group">
              <label>Amount ($)</label>
              <input type="number" id="transfer-amount" step="0.01" min="0.01" required placeholder="50.00">
            </div>
            <button type="submit" class="btn-primary">Execute Transfer</button>
          </form>
        </div>

        <div class="card history-card full-width">
          <h3>Transaction Activity</h3>
          <div class="table-wrapper">
            <table class="history-table">
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Transaction ID</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="tx-history-body">
                <tr><td colspan="4" class="empty-state">No transactions yet</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
